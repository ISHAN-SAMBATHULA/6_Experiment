<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Student Management System</title>
  <meta name="description" content="Student Management System Dashboard — view total students, branches, and recent registrations." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar-slot"></div>

  <div class="app">
    <div class="main">
      <header class="page-header">
        <h1>Dashboard</h1>
        <p>Overview of your campus data at a glance.</p>
      </header>

      <!-- stat cards -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-card__icon stat-card__icon--primary">👥</div>
          <div><div class="stat-card__value" id="stat-total">—</div><div class="stat-card__label">Total Students</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card__icon stat-card__icon--accent">🏫</div>
          <div><div class="stat-card__value" id="stat-branches">—</div><div class="stat-card__label">Branches</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card__icon stat-card__icon--info">📅</div>
          <div><div class="stat-card__value" id="stat-years">—</div><div class="stat-card__label">Year Groups</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-card__icon stat-card__icon--warning">📊</div>
          <div><div class="stat-card__value" id="stat-registered">—</div><div class="stat-card__label">Total Registered</div></div>
        </div>
      </div>

      <!-- breakdown + recent -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
        <div class="card">
          <div class="card__header"><span class="card__title">Branch / Year Breakdown</span></div>
          <div id="breakdown"></div>
        </div>
        <div class="card">
          <div class="card__header"><span class="card__title">Recently Registered</span></div>
          <div id="recent"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
