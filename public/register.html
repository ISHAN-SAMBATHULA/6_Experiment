<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration — Student Management System</title>
  <meta name="description" content="Add, edit, and delete student records." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar-slot"></div>

  <div class="app">
    <div class="main" style="margin-left:260px">
      <header class="page-header flex justify-between items-center">
        <div>
          <h1>Student Registration</h1>
          <p>Add, edit, and manage student records.</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Student</button>
      </header>

      <!-- student list -->
      <div class="card">
        <div id="student-list"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="student-modal">
    <div class="modal">
      <div class="modal__header">
        <h2 id="modal-title">Add Student</h2>
        <button class="modal__close" onclick="closeModal('student-modal')">✕</button>
      </div>
      <form id="student-form" onsubmit="handleStudentSubmit(event)">
        <input type="hidden" id="edit-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="f-name">Full Name *</label>
            <input class="form-control" id="f-name" required placeholder="John Doe" />
          </div>
          <div class="form-group">
            <label for="f-roll">Roll Number *</label>
            <input class="form-control" id="f-roll" required placeholder="21CS001" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-branch">Branch *</label>
            <select class="form-control" id="f-branch" required>
              <option value="">Select branch</option>
              <option>CSE</option>
              <option>ECE</option>
              <option>EEE</option>
              <option>MECH</option>
              <option>CIVIL</option>
              <option>IT</option>
              <option>AIDS</option>
              <option>AIML</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-year">Year *</label>
            <select class="form-control" id="f-year" required>
              <option value="">Select year</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-email">Email</label>
            <input class="form-control" id="f-email" type="email" placeholder="john@example.com" />
          </div>
          <div class="form-group">
            <label for="f-phone">Phone</label>
            <input class="form-control" id="f-phone" placeholder="9876543210" />
          </div>
        </div>
        <div class="flex justify-between mt-2">
          <button type="button" class="btn btn-ghost" onclick="closeModal('student-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">Add Student</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
