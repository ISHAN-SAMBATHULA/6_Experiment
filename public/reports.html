<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Student Management System</title>
  <meta name="description" content="Search, filter, and view detailed student reports." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar-slot"></div>

  <div class="app">
    <div class="main">
      <header class="page-header">
        <h1>Search, Filter &amp; Reports</h1>
        <p>Find students and view their full report card.</p>
      </header>

      <!-- search / filter bar -->
      <div class="card mb-2">
        <div class="form-row" style="align-items:flex-end">
          <div class="form-group" style="margin-bottom:0">
            <label for="r-search">Search</label>
            <input class="form-control" id="r-search" placeholder="Name or roll number…" oninput="applyFilters()" />
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label for="r-branch">Branch</label>
            <select class="form-control" id="r-branch" onchange="applyFilters()">
              <option value="">All</option>
              <option>CSE</option><option>ECE</option><option>EEE</option>
              <option>MECH</option><option>CIVIL</option><option>IT</option>
              <option>AIDS</option><option>AIML</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label for="r-year">Year</label>
            <select class="form-control" id="r-year" onchange="applyFilters()">
              <option value="">All</option>
              <option value="1">1st</option><option value="2">2nd</option>
              <option value="3">3rd</option><option value="4">4th</option>
            </select>
          </div>
        </div>
      </div>

      <!-- results table -->
      <div class="card">
        <div id="results"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- Report Modal -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal" style="max-width:640px">
      <div class="modal__header">
        <h2>Student Report</h2>
        <button class="modal__close" onclick="closeModal('report-modal')">✕</button>
      </div>
      <div id="report-content"></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
